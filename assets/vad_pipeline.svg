<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">VAD training and evaluation workflow</title>
  <desc id="desc">Three aligned visual views feed counterfactual target reconstruction, followed by on-policy training, fast monitoring, and official Vision-OPD evaluation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#11143a"/>
      <stop offset="1" stop-color="#25113c"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="588" rx="30" fill="url(#background)" stroke="#334155" stroke-width="2"/>

  <text
    x="600"
    y="53"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="26"
    font-weight="750"
  >One training row · Three aligned visual conditions</text>
  <text
    x="600"
    y="82"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="16"
  >Only the visual evidence changes; the teacher, question, and student-generated prefix remain controlled.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="120" width="310" height="126" rx="20" fill="#0c2542" stroke="#38bdf8" stroke-width="2"/>
    <rect x="445" y="120" width="310" height="126" rx="20" fill="#231b4b" stroke="#818cf8" stroke-width="2"/>
    <rect x="835" y="120" width="310" height="126" rx="20" fill="#35183f" stroke="#c084fc" stroke-width="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <circle cx="91" cy="154" r="17" fill="#0ea5e9"/>
    <text x="91" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">S</text>
    <text x="120" y="160" fill="#e0f2fe" font-size="21" font-weight="750">Student view</text>
    <text x="82" y="197" fill="#bae6fd" font-size="16">Full image used for rollout</text>
    <text x="82" y="224" fill="#7dd3fc" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">images</text>

    <circle cx="481" cy="154" r="17" fill="#6366f1"/>
    <text x="481" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">+</text>
    <text x="510" y="160" fill="#e0e7ff" font-size="21" font-weight="750">Evidence present</text>
    <text x="472" y="197" fill="#c7d2fe" font-size="16">Clear crop for the fixed teacher</text>
    <text x="472" y="224" fill="#a5b4fc" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bbox_images</text>

    <circle cx="871" cy="154" r="17" fill="#a855f7"/>
    <text x="871" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">-</text>
    <text x="900" y="160" fill="#f3e8ff" font-size="21" font-weight="750">Evidence degraded</text>
    <text x="862" y="197" fill="#e9d5ff" font-size="16">Matched crop with detail removed</text>
    <text x="862" y="224" fill="#d8b4fe" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">degraded_bbox_images</text>
  </g>

  <g fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M210 247 C210 290 392 284 446 315"/>
    <path d="M600 247 L600 303"/>
    <path d="M990 247 C990 290 808 284 754 315"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="308" width="600" height="104" rx="24" fill="url(#target)" opacity="0.97"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="349" fill="#ffffff" font-size="24" font-weight="800">VAD target reconstruction</text>
    <text x="600" y="380" fill="#eef2ff" font-size="16">Student-anchored · budgeted asymmetric correction · fixed initial teacher</text>
  </g>

  <g fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M600 413 L600 454"/>
    <path d="M540 412 C505 445 328 435 266 468"/>
    <path d="M660 412 C695 445 872 435 934 468"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="55" y="462" width="310" height="90" rx="18" fill="url(#output)" stroke="#38bdf8"/>
    <rect x="445" y="462" width="310" height="90" rx="18" fill="url(#output)" stroke="#818cf8"/>
    <rect x="835" y="462" width="310" height="90" rx="18" fill="url(#output)" stroke="#c084fc"/>

    <text x="82" y="497" fill="#e0f2fe" font-size="19" font-weight="750">1. Train</text>
    <text x="82" y="526" fill="#bae6fd" font-size="15">4B / 9B on-policy optimization</text>

    <text x="472" y="497" fill="#e0e7ff" font-size="19" font-weight="750">2. Monitor</text>
    <text x="472" y="526" fill="#c7d2fe" font-size="15">4 fast benchmarks every 10 steps</text>

    <text x="862" y="497" fill="#f3e8ff" font-size="19" font-weight="750">3. Report</text>
    <text x="862" y="526" fill="#e9d5ff" font-size="15">Official 6-set eval + GPT-OSS-120B</text>
  </g>
</svg>
